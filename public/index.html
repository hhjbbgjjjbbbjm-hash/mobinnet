<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت کانفیگ Railway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Login Card -->
  <div id="loginCard" class="w-full max-w-md glass rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <i class="fa-solid fa-shield-halved text-4xl text-indigo-500 mb-2"></i>
      <h1 class="text-2xl font-bold">ورود به پنل مدیریت</h1>
      <p class="text-gray-400 text-sm mt-1">Railway Xray Controller</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">نام کاربری</label>
        <input type="text" id="username" class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 focus:border-indigo-500 focus:outline-none" required>
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">رمز عبور</label>
        <input type="password" id="password" class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 focus:border-indigo-500 focus:outline-none" required>
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">ورود</button>
    </form>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="w-full max-w-5xl glass rounded-2xl p-6 shadow-2xl hidden">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-server text-3xl text-indigo-400"></i>
        <div>
          <h2 class="text-xl font-bold">مدیریت کاربرها و کانفیگ‌ها</h2>
          <p class="text-xs text-gray-400">وضعیت سرور: <span class="text-emerald-400">● آنلاین</span></p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="openSettings()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl text-sm flex items-center gap-2"><i class="fa-solid fa-gear"></i> تنظیمات</button>
        <button onclick="logout()" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-4 py-2 rounded-xl text-sm flex items-center gap-2"><i class="fa-solid fa-power-off"></i> خروج</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="my-6 flex justify-between items-center">
      <button onclick="addUser()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 shadow-lg shadow-indigo-600/20"><i class="fa-solid fa-plus"></i> ساخت کاربر جدید</button>
    </div>

    <!-- User Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 text-sm">
            <th class="p-3">نام کاربر</th>
            <th class="p-3">UUID</th>
            <th class="p-3">وضعیت</th>
            <th class="p-3 text-center">عملیات</th>
          </tr>
        </thead>
        <tbody id="userTable" class="divide-y divide-gray-800/50 text-sm"></tbody>
      </table>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass max-w-lg w-full rounded-2xl p-6 text-center space-y-4">
      <h3 id="qrModalTitle" class="text-lg font-bold"></h3>
      <div class="flex justify-center bg-white p-4 rounded-xl w-fit mx-auto"><canvas id="qrcode"></canvas></div>
      <div class="space-y-2 text-xs text-left font-mono break-all bg-gray-900 p-3 rounded-xl border border-gray-800 text-gray-300 max-h-40 overflow-y-auto" id="configLinks"></div>
      <button onclick="closeModal()" class="w-full bg-gray-800 hover:bg-gray-700 py-2 rounded-xl">بستن</button>
    </div>
  </div>

  <script>
    async function api(url, method = 'GET', body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401) {
        document.getElementById('loginCard').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/login', 'POST', {
          username: e.target.username.value,
          password: e.target.password.value
        });
        loadDashboard();
      } catch (err) { alert(err.message); }
    };

    async function loadDashboard() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      const users = await api('/api/users');
      const tbody = document.getElementById('userTable');
      tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-gray-800/30">
          <td class="p-3 font-semibold">${u.name}</td>
          <td class="p-3 font-mono text-xs text-gray-400">${u.uuid}</td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${u.status === 'active' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${u.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
          <td class="p-3 flex justify-center gap-2">
            <button onclick="showSub('${u.uuid}', '${u.name}')" class="bg-indigo-500/20 text-indigo-400 p-2 rounded-lg hover:bg-indigo-500/30" title="ساب لینک و کانفیگ"><i class="fa-solid fa-qrcode"></i></button>
            <button onclick="toggleUser('${u.id}')" class="bg-amber-500/20 text-amber-400 p-2 rounded-lg hover:bg-amber-500/30" title="تغییر وضعیت"><i class="fa-solid fa-power-off"></i></button>
            <button onclick="deleteUser('${u.id}')" class="bg-red-500/20 text-red-400 p-2 rounded-lg hover:bg-red-500/30" title="حذف"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function addUser() {
      const name = prompt("نام کاربر جدید را وارد کنید:");
      if (name) {
        await api('/api/users', 'POST', { name });
        loadDashboard();
      }
    }

    async function toggleUser(id) {
      await api(`/api/users/${id}/toggle`, 'PUT');
      loadDashboard();
    }

    async function deleteUser(id) {
      if (confirm("آیا از حذف این کاربر اطمینان دارید؟")) {
        await api(`/api/users/${id}`, 'DELETE');
        loadDashboard();
      }
    }

    function showSub(uuid, name) {
      const host = window.location.host;
      const subUrl = `${window.location.protocol}//${host}/sub/${uuid}`;
      document.getElementById('qrModalTitle').innerText = `ساب‌لینک کاربر: ${name}`;
      
      QRCode.toCanvas(document.getElementById('qrcode'), subUrl, { width: 180 });

      document.getElementById('configLinks').innerHTML = `
        <div class="mb-2"><strong class="text-indigo-400">لینک ساب‌لینک (توصیه شده):</strong><br>${subUrl}</div>
        <button onclick="navigator.clipboard.writeText('${subUrl}'); alert('کپی شد!')" class="w-full bg-indigo-600/40 hover:bg-indigo-600 text-white py-1 rounded">کپی لینک ساب‌لینک</button>
      `;
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('qrModal').classList.add('hidden'); }
    async function logout() { await api('/api/logout', 'POST'); location.reload(); }
    async function openSettings() {
      const username = prompt("نام کاربری جدید:");
      const password = prompt("رمز عبور جدید:");
      if (username || password) {
        await api('/api/settings', 'POST', { username, password });
        alert("تنظیمات با موفقیت ذخیره شد.");
      }
    }

    loadDashboard().catch(() => {});
  </script>
</body>
</html>
